<!DOCTYPE html>
<html>
<head>
    <title>Lists in XHTML</title>
</head>
<body>
    <h1 align="center">Lists in XHTML</h1>

    <h2>Ordered List</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Bootcamp</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Google Chrome</li>
        <li>Mozilla Firefox</li>
        <li>Microsoft Edge</li>
    </ul>

    <h2>Defination List</h2>
    <dl>
        <dt><b>HTML</b></dt>
        <dd>HTML</dd>

        <dt><b>CSS</b></dt>
        <dd>Cascading Style sheets.</dd>

        <dt><b>JavaScript</b></dt>
        <dd>JS</dd>
    </dl>
</body>
</html>
