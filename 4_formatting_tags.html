<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags</title>
</head>
<body>
    <h1 align="center">Formatting Tags in XHTML</h1>
    <h2>Introduction</h2>
    <p>
        XHTML provides several formatting tags to improve presentation of text
    </p>
    <p>
        <b>Bold Text</b><br/>
        <i>Italic Text</i><br/>
        <u>Underlined Text</u><br/>
        <strong>Strong Text</strong><br/>
        <em>Emphasized Text</em><br/>
        <mark>Highlighted Text</mark><br/>
        <small>Small Text</small><br/>
        X<sup>2</sup><br/>
        H<sub>2</sub>O
    </p>
</body>
</html>
